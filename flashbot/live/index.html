<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flashbot Live Base</title><style>body{font-family:system-ui;background:#0b0f14;color:#eef2f7;margin:0;padding:20px}.card{background:#121923;border:1px solid #263244;border-radius:14px;padding:16px;margin:12px 0}pre{white-space:pre-wrap;word-break:break-word}.ok{color:#65e89b}.bad{color:#ff7f7f}</style></head><body><h1>Flashbot Live Base</h1><div class="card"><b>Live chain health</b><pre id="out">Connecting…</pre></div><script>const RPCS=['https://mainnet.base.org','https://mainnet-preconf.base.org'];async function rpc(url,method,params=[]){const t=performance.now();const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params})});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();if(j.error)throw new Error(j.error.message||'RPC error');return {result:j.result,ms:Math.round(performance.now()-t)}}async function run(){let errs=[];for(const url of RPCS){try{const c=await rpc(url,'eth_chainId'),b=await rpc(url,'eth_blockNumber'),g=await rpc(url,'eth_gasPrice');const chainId=parseInt(c.result,16),blockNumber=parseInt(b.result,16),gasPriceWei=BigInt(g.result).toString();const x={ok:chainId===8453,mode:'READ_ONLY_BROWSER_RPC',rpc:url,chain:'base',chainId,blockNumber,gasPriceWei,rpcLatencyMs:{chain:c.ms,block:b.ms,gas:g.ms},observedAt:new Date().toISOString(),signingEnabled:false,broadcastEnabled:false};out.className=x.ok?'ok':'bad';out.textContent=JSON.stringify(x,null,2);return}catch(e){errs.push(url+': '+e.message)}}out.className='bad';out.textContent=JSON.stringify({ok:false,errors:errs,observedAt:new Date().toISOString()},null,2)}run();setInterval(run,15000)</script></body></html>
