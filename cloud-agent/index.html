<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chain Hunter</title><style>body{margin:0;background:#090b10;color:#e8edf5;font:14px system-ui;padding:16px}h1{font-size:22px;margin:0 0 4px}.sub{color:#8993a4;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:#111620;border:1px solid #242c3a;border-radius:14px;padding:13px}.k{font-size:11px;color:#8b97aa;text-transform:uppercase}.v{font-size:19px;font-weight:700;margin-top:5px;word-break:break-word}.wide{grid-column:1/-1}.ok{color:#56e39f}.bad{color:#ff6b78}.warn{color:#ffd166}table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12px}td,th{text-align:left;border-bottom:1px solid #252c38;padding:7px 4px}button{background:#e8edf5;color:#090b10;border:0;border-radius:10px;padding:9px 12px;font-weight:700}.mono{font-family:ui-monospace,monospace}.small{font-size:11px;color:#8993a4}</style></head><body><h1>CHAIN HUNTER</h1><div class="sub">READ_ONLY_VERIFIED · signing OFF · broadcast OFF</div><div class="grid"><div class="card"><div class="k">Status</div><div id="status" class="v warn">LOADING</div></div><div class="card"><div class="k">Base block</div><div id="block" class="v">—</div></div><div class="card"><div class="k">Gas price wei</div><div id="gas" class="v mono">—</div></div><div class="card"><div class="k">RPC latency</div><div id="lat" class="v">—</div></div><div class="card"><div class="k">Borrow events</div><div id="borrows" class="v">—</div></div><div class="card"><div class="k">Accounts scored</div><div id="scored" class="v">—</div></div><div class="card"><div class="k">Lowest HF</div><div id="hf" class="v">—</div></div><div class="card"><div class="k">Verified liquidatable</div><div id="liq" class="v">—</div></div><div class="card wide"><div class="k">Verified opportunities</div><table><thead><tr><th>User</th><th>latest HF</th><th>pending HF</th></tr></thead><tbody id="rows"><tr><td colspan="3">None loaded</td></tr></tbody></table></div><div class="card wide"><button onclick="refreshAll()">Refresh now</button><div id="stamp" class="small" style="margin-top:8px"></div></div></div><script>const $=id=>document.getElementById(id);async function j(u){const r=await fetch(u,{cache:'no-store'});const x=await r.json();if(!r.ok||!x.ok)throw new Error(x.error||('HTTP '+r.status));return x}async function refreshAll(){try{$('status').textContent='SCANNING';$('status').className='v warn';const [l,a]=await Promise.all([j('/api/live'),j('/api/aave-near?window=2500')]);$('block').textContent=l.block_number.toLocaleString();$('gas').textContent=l.gas_price_wei;$('lat').textContent=l.elapsed_ms+' ms';$('borrows').textContent=a.borrow_events.toLocaleString();$('scored').textContent=a.accounts_scored.toLocaleString();$('hf').textContent=a.lowest?.[0]?.hf?.toFixed(6)??'—';const v=a.verified_liquidatable_now||[];$('liq').textContent=v.length;$('liq').className='v '+(v.length?'bad':'ok');$('rows').innerHTML=v.length?v.map(x=>`<tr><td class="mono">${x.user.slice(0,8)}…${x.user.slice(-6)}</td><td>${x.hf.toFixed(8)}</td><td>${x.pending_hf?.toFixed(8)??'—'}</td></tr>`).join(''):'<tr><td colspan="3">No dual-RPC verified liquidation now</td></tr>';$('status').textContent='LIVE';$('status').className='v ok';$('stamp').textContent='Updated '+new Date().toLocaleString()+' · '+a.verification.policy}catch(e){$('status').textContent='ERROR';$('status').className='v bad';$('stamp').textContent=String(e)}}refreshAll();setInterval(refreshAll,30000);</script></body></html>
