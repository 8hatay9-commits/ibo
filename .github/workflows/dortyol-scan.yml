name: Dörtyol Reality Coverage Scan

on:
  workflow_dispatch:
  push:
    branches:
      - dortyol-reality-engine
    paths:
      - 'dortyol-reality-engine/**'
      - '.github/workflows/dortyol-scan.yml'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reality branch
        uses: actions/checkout@v6
        with:
          ref: dortyol-reality-engine
      - name: Scan public ground-imagery coverage
        run: python3 dortyol-reality-engine/scan_coverage.py
      - name: Persist coverage result
        run: |
          if git diff --quiet -- dortyol-reality-engine/coverage.json; then
            echo "Coverage unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dortyol-reality-engine/coverage.json
          git commit -m "Update Dörtyol ground-imagery coverage"
          git push origin HEAD:dortyol-reality-engine
