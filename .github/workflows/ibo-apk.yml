name: IBO Android APK

on:
  push:
    branches:
      - ibo-agent-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Fetch Android shell
        run: git clone --depth 1 --branch dev https://github.com/xchacha20-poly1305/webview-apk-template.git android-shell

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: Configure IBO
        working-directory: android-shell
        run: |
          cat > app.properties <<'EOF'
          app.url=https://ibo-agent-runtime-8hatay9-9554s-projects.vercel.app/
          app.package=ai.ibo.agent
          app.name=İBO
          app.icon_url=
          app.icon_fallback=false
          EOF

      - name: Build APK
        working-directory: android-shell
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IBO-APK
          path: android-shell/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
