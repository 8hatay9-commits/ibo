name: Live Base RPC Probe

on:
  push:
    branches: [main]
    paths-ignore:
      - 'agent/live_result.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  live-rpc:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Query Base mainnet live RPC
        shell: bash
        run: |
          set +e
          python3 agent/live_rpc_probe.py > agent/live_result.json
          STATUS=$?
          cat agent/live_result.json
          echo "PROBE_STATUS=$STATUS" >> "$GITHUB_ENV"
          exit 0

      - name: Commit live result
        shell: bash
        run: |
          git config user.name 'chatgpt-live-agent'
          git config user.email 'actions@users.noreply.github.com'
          git add agent/live_result.json
          if git diff --cached --quiet; then
            echo 'No result change'
          else
            git commit -m 'Update live Base RPC result [skip ci]'
            git push origin main
          fi

      - name: Fail if RPC probe failed
        shell: bash
        run: |
          test "${PROBE_STATUS:-1}" = "0"
