name: Live Base RPC Probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-base-rpc-probe
  cancel-in-progress: true

jobs:
  live-rpc:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe Base RPC with failover
        shell: bash
        run: |
          python3 - <<'PY'
          import json, time, urllib.request

          rpcs = [
              "https://mainnet.base.org",
              "https://mainnet-preconf.base.org",
          ]

          def call(url, method):
              body = json.dumps({"jsonrpc":"2.0","id":1,"method":method,"params":[]}).encode()
              req = urllib.request.Request(url, data=body, headers={"Content-Type":"application/json","User-Agent":"ibo-live-probe/2.0"}, method="POST")
              with urllib.request.urlopen(req, timeout=12) as r:
                  data = json.loads(r.read().decode())
              if data.get("error"):
                  raise RuntimeError(data["error"])
              return data["result"]

          errors = []
          for url in rpcs:
              for attempt in range(1, 4):
                  started = time.perf_counter()
                  try:
                      chain_id = int(call(url, "eth_chainId"), 16)
                      block = int(call(url, "eth_blockNumber"), 16)
                      gas = int(call(url, "eth_gasPrice"), 16)
                      if chain_id != 8453:
                          raise RuntimeError(f"unexpected chain id {chain_id}")
                      print(json.dumps({
                          "status": "PASS",
                          "rpc": url,
                          "chain_id": chain_id,
                          "block_number": block,
                          "gas_price_wei": gas,
                          "latency_ms": round((time.perf_counter()-started)*1000, 1),
                      }, indent=2))
                      raise SystemExit(0)
                  except Exception as exc:
                      errors.append({"rpc": url, "attempt": attempt, "error": repr(exc)})
                      time.sleep(attempt)

          print(json.dumps({"status":"FAIL","errors":errors}, indent=2))
          raise SystemExit(1)
          PY
