name: Live Base RPC Probe

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-rpc:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Prove runner and Base RPC without checkout
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNNER_OK $(date -u +%FT%TZ)"
          curl --fail --show-error --silent --max-time 15 \
            -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}' \
            https://mainnet.base.org
