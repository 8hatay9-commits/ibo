name: Live Base RPC Probe

on:
  push:
    branches: [flashbot-agent]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  live-rpc:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Base chain id
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE=$(curl --fail-with-body --silent --show-error --max-time 15 \
            -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' \
            https://mainnet.base.org)
          echo "CHAIN_RESPONSE=$RESPONSE"
          echo "$RESPONSE" | grep -q '"result":"0x2105"'

      - name: Query live Base block number
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE=$(curl --fail-with-body --silent --show-error --max-time 15 \
            -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":2,"method":"eth_blockNumber","params":[]}' \
            https://mainnet.base.org)
          echo "LIVE_BLOCK_RESPONSE=$RESPONSE"
          echo "$RESPONSE" | grep -Eq '"result":"0x[0-9a-fA-F]+"'
