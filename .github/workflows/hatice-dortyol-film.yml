name: Build Hatice Dortyol Film

on:
  push:
    branches:
      - hatice-dortyol-film
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow numpy opencv-python-headless requests

      - name: Render film
        run: python tools/hatice_dortyol_film.py

      - name: Upload film artifact
        uses: actions/upload-artifact@v4
        with:
          name: hatice-dortyol-film
          if-no-files-found: error
          retention-days: 7
          path: |
            hatice-dortyol-takeover.mp4
            hatice-dortyol-poster.jpg
