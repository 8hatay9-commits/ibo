name: Hash V396

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hash-v396
  cancel-in-progress: true

jobs:
  hash-v396:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Verify daemon SHA256
        shell: bash
        run: |
          set -euo pipefail
          test -f flashbot/releases/v3.9.6/daemon.py
          test -f flashbot/releases/v3.9.6/daemon.sha256.txt
          ACTUAL="$(sha256sum flashbot/releases/v3.9.6/daemon.py | awk '{print $1}')"
          EXPECTED="$(tr -d '[:space:]' < flashbot/releases/v3.9.6/daemon.sha256.txt)"
          echo "actual=$ACTUAL"
          echo "expected=$EXPECTED"
          test "$ACTUAL" = "$EXPECTED"
