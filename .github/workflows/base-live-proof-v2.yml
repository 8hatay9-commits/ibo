name: Base Live Proof V2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: base-live-proof-v2
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Query Base Flashblocks read-only
        shell: bash
        run: |
          set -euo pipefail
          RPC='https://mainnet-preconf.base.org'
          CHAIN=$(curl -fsS --retry 2 --retry-all-errors --max-time 10 -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' "$RPC")
          BLOCK=$(curl -fsS --retry 2 --retry-all-errors --max-time 10 -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":2,"method":"eth_getBlockByNumber","params":["pending",false]}' "$RPC")
          export CHAIN BLOCK
          python3 - <<'PY'
          import json, os, time
          chain=json.loads(os.environ['CHAIN'])
          block=json.loads(os.environ['BLOCK'])
          if chain.get('error'): raise SystemExit('chain rpc error: '+json.dumps(chain['error']))
          if block.get('error'): raise SystemExit('block rpc error: '+json.dumps(block['error']))
          b=block['result']
          out={
            'ok': int(chain['result'],16)==8453,
            'source':'github-actions-direct-rpc',
            'rpc':RPC if False else 'https://mainnet-preconf.base.org',
            'chain_id':int(chain['result'],16),
            'pending_block':int(b['number'],16),
            'pending_timestamp':int(b['timestamp'],16),
            'block_hash':b.get('hash'),
            'observed_at_unix':time.time(),
            'mode':'READ_ONLY'
          }
          print(json.dumps(out,indent=2,sort_keys=True))
          if not out['ok']: raise SystemExit(2)
          PY
