name: Build IBO SmartRemote APK
on:
  push:
    branches: [ibo-smartremote-apk]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: yes | sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle -p ibo-smartremote :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: IBO-SmartRemote-APK
          path: ibo-smartremote/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
