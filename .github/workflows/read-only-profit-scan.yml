name: Read-only profit scan

on:
  push:
    paths:
      - 'flashbot/research/read_only_profit_scan.py'
      - '.github/workflows/read-only-profit-scan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan Base Aave read-only
        run: python flashbot/research/read_only_profit_scan.py
      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profit-scan-report
          path: profit_scan_report.json
          if-no-files-found: warn
          retention-days: 1
