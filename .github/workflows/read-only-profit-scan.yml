name: Read-only profit scan

on:
  push:
    paths:
      - 'flashbot/research/read_only_profit_scan.py'
      - '.github/workflows/read-only-profit-scan.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan Base Aave read-only
        run: python flashbot/research/read_only_profit_scan.py
      - name: Persist latest report
        if: always()
        shell: bash
        run: |
          if [ -f profit_scan_report.json ]; then
            cp profit_scan_report.json flashbot/research/latest_profit_scan.json
            git config user.name "flashbot-readonly-bot"
            git config user.email "flashbot-readonly-bot@users.noreply.github.com"
            git add flashbot/research/latest_profit_scan.json
            if ! git diff --cached --quiet; then
              git commit -m "flashbot: update read-only profit scan [skip ci]"
              git push
            fi
          fi
      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profit-scan-report
          path: profit_scan_report.json
          if-no-files-found: warn
          retention-days: 1
